[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "xskill"
dynamic = ["version"]
description = "Distill reusable Skills from AI Agent execution trajectories"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "SkillNerds", email = "370025263@qq.com" }]
keywords = ["agent", "skill", "trajectory", "llm", "rag", "self-evolving"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.24",
    "openai>=1.0",
    "agno",
    "tqdm",
    "httpx",
    "fastapi",
    "python-multipart",
    "uvicorn",
    "sse-starlette",
    "packaging>=23",
    "rank-bm25>=0.2",
    # team 模式上传前的轨迹脱敏（team/client/redact.py）。脱敏是上传链路的
    # 强制环节，故列为主依赖而非 optional extra——缺库就该 import 失败。
    "detect-secrets>=1.5",
    # 纯 Python git 实现，替代系统 ``git`` 二进制——容器/受限环境（如
    # ``python:3.9-slim``）默认没装 git，SkillEditAgent 等链路又要跑 git
    # init/commit/branch；走 dulwich 后零依赖系统 git。
    "dulwich>=0.21",
    # Python 3.9 上 pydantic 需要它来求值 `X | Y` 联合注解（PEP 604 语法
    # 3.10 才原生支持）；3.10+ 不安装。
    "eval_type_backport; python_version < '3.10'",
]

[project.optional-dependencies]
# 嵌入式向量索引（Milvus Lite）。非必需：缺省走 numpy / 内存 fallback，
# 大库上会更慢。team server 建议：pip install 'xskill[milvus]'。
# 不进主依赖——pymilvus 体积大、部分环境装不上，曾阻断 client 自动更新。
milvus = [
    "pymilvus[milvus_lite]>=2.4.2",
]
# DeepSeek Harness 默认写 session.jsonl.zstd。不进主依赖：0.6.32a2 把它
# 放进 Requires-Dist 后，内网客户端装 server wheel 还要穿过坏代理去拉
# 传递依赖，全员自动更新失败（#334）。有 dsh 的机器由
# ``ensure_zstandard_for_dsh`` 现场补装；也可 ``pip install 'xskill[dsh]'``。
dsh = [
    "zstandard>=0.21",
]
# Generate 观测。不进主依赖。观测机：pip install 'xskill[obs]'，再设
# XSKILL_OTEL_ENDPOINT。LLM 对话走 OpenAIInstrumentor，不手包 invoke。
obs = [
    "arize-phoenix-otel>=0.16.0",
    "openinference-instrumentation-openai",
]
dev = [
    "pytest>=7",
    "pytest-timeout>=2",
    "pytest-asyncio>=0.21",
    "pytest-bdd>=8,<9",
    # Known CI flakes (SQLite WAL lock / short TTL cache race) use
    # ``@pytest.mark.flaky`` from this plugin; see marked tests below.
    "pytest-rerunfailures>=14",
    "requests>=2",
    # HTTP LLM contract tests only.  The Python fixture downloads the pinned
    # @copilotkit/aimock npm artifact and manages its local Node.js process.
    "aimock-pytest==0.5.0; python_version >= '3.10'",
    # Mutation testing is a developer/CI concern and never enters the wheel's
    # runtime dependency set.
    "mutmut>=3.6,<4; python_version >= '3.10'",
    # dsh 默认 zstd 会话的解码单测（``xskill[dsh]`` 运行时依赖）。
    "zstandard>=0.21",
]

[project.urls]
Homepage = "https://github.com/SkillNerds/xskill"
Repository = "https://github.com/SkillNerds/xskill"
Issues = "https://github.com/SkillNerds/xskill/issues"

[project.scripts]
xskill = "xskill.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
xskill = [
    "data/*.json",            # vendored 价格表(Issue #43),随 wheel 发布
    "dashboard/static/*",     # 看板前端壳(index.html / app.js / i18n.js),随 wheel 发布
    "agents/prompts/*.txt",   # skill-creator 官方提示词(case生成/desc优化),随 wheel 发布
    "data/skill/xskill-helper/*",    # 捆绑的 /xskill-helper 使用指南（connect 装到各生态）
    "data/skill/xskill-helper/**/*", # 上者的子目录(references 等)一并打包
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_file = "src/xskill/_version.py"
fallback_version = "0.0.0+unknown"

[tool.pytest.ini_options]
markers = [
    # ``live_agent`` 标记的测试会真 spawn codex/opencode 子进程对接 mock LLM
    # server，验证端到端流程通——不调真 LLM API。默认排除（``addopts`` 含
    # ``--ignore=tests/live``）；CI live-agent-e2e job + 本地手动跑用
    # ``pytest -m live_agent`` 触发。
    "live_agent: real codex/opencode process + mock LLM end-to-end (slow, optional)",
    "stress: slow real-process load and smoke tests (excluded by default)",
    "bdd: executable product behavior specifications",
    "http_llm: real OpenAI-compatible HTTP boundary backed by local aimock",
    "state_machine: deterministic SkillEdit state-machine coverage for mutation testing",
    "first_use: uninitialized / first-install local search and status behavior",
    "reindex: skill vector index rebuild resilience",
    "issue46: regression coverage for SkillNerds/xskill#46",
    "issue200: regression coverage for SkillNerds/xskill#200",
    "primary: primary user success journey",
    "golden_path: end-to-end happy-path behavior",
    "recovery: retry and restart recovery behavior",
    "contract: external protocol contract behavior",
    "observability: operator-facing trace behavior",
    "estimate: token estimation accuracy behavior",
    "coverage: message field coverage in token estimation",
    "overhead: token estimation overhead bounds",
    "performance_contract: deterministic hot-path complexity contract",
    "algorithm_replay: deterministic Atom splitting and routing quality replay",
    "family-band: model family error band behavior",
    "trigger: spill/compact trigger behavior",
    "spill: spill trigger behavior",
    "compact: compact trigger behavior",
    "calibration: EMA calibration behavior",
    "unknown-family: unknown model family fallback behavior",
    # Registered by pytest-rerunfailures; listed here so ``pytest --markers``
    # documents the known CI flake retries.
    "flaky: known intermittent CI failures; rerun via pytest-rerunfailures",
    # 负载/平台时序敏感的测试移出 PR 矩阵（ci.yml 加 -m "not nightly"），
    # 由 nightly workflow 按平台矩阵跑，允许靠 reruns 抽签通过。
    "nightly: load/platform-sensitive tests; excluded from PR matrix, run in nightly workflow",
]
addopts = "--ignore=tests/live --ignore=tests/stress"
pythonpath = ["src"]
asyncio_mode = "strict"

[tool.mutmut]
# Keep mutation testing focused on the Issue #146 durable boundaries:
# framework-owned candidate consumption and baby graduation.  The local HTTP
# contract is intentionally excluded: mutation workers should not start a
# Node process or depend on fixture timing.
source_paths = ["src/xskill"]
only_mutate = [
    "src/xskill/skill/candidates.py",
    "src/xskill/agents/agent_tools.py",
]
# Logging prose and spelling-equivalent encoding names are not observable
# product behavior; mutating them creates equivalent mutants.
do_not_mutate_patterns = [
    "logger\\.",
    "encoding=\"utf-8\"",
]
pytest_add_cli_args = ["-q", "--override-ini=addopts="]
pytest_add_cli_args_test_selection = [
    "tests/bdd/test_skill_edit_state_machine.py",
    "tests/test_skill_edit_batch_turns.py::TestRemoveCandidates",
    "tests/test_skill_edit_mutation_contracts.py",
]
timeout_multiplier = 5.0
timeout_constant = 1.0
