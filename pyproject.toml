[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "xskill"
dynamic = ["version"]
description = "Distill reusable Skills from AI Agent execution trajectories"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SkillNerds", email = "370025263@qq.com" }]
keywords = ["agent", "skill", "trajectory", "llm", "rag", "self-evolving"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "datasets>=2.14",
    "huggingface-hub>=0.17",
    "openai>=1.0",
    "agno",
    "tqdm",
    "httpx",
    "fastapi",
    "uvicorn",
    "sse-starlette",
    "rank-bm25>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/SkillNerds/xskill"
Repository = "https://github.com/SkillNerds/xskill"
Issues = "https://github.com/SkillNerds/xskill/issues"

[project.scripts]
xskill = "xskill.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xskill = ["web/dist/**/*"]

[tool.setuptools_scm]
version_file = "src/xskill/_version.py"
fallback_version = "0.0.0+unknown"
