# Dedicated 300×300 control-plane stress workflow.
# Runs daily at UTC 16:00 (Beijing time 00:00 the following day) and on demand.
# It is intentionally independent of regular CI and the release publish gate.

name: Nightly Control-Plane Stress

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-control-plane-stress
  cancel-in-progress: false

jobs:
  nightly-flaky:
    # PR 矩阵移出的负载/平台时序敏感测试（pyproject ``nightly`` 标记）：
    # 按平台矩阵夜跑，靠 pytest-rerunfailures 抽签通过，不再挡 PR。
    name: nightly flaky set (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Normalize line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf input
      - name: Install package with dev extras
        run: pip install -e .[dev]
      - name: Run nightly-marked tests
        run: pytest tests/ -m nightly -q --timeout=300

  control-plane-stress:
    name: control-plane stress (300x300, py3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package with dev and Milvus extras
        run: pip install -e '.[dev,milvus]'
      - name: Run 300x300 control-plane stress test
        run: >-
          pytest tests/stress/test_control_plane_300.py -v
          --override-ini="addopts=" -m stress
          --basetemp=.stress-artifacts
      - name: Upload stress-test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-control-plane-stress-${{ github.run_id }}
          path: .stress-artifacts/**
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
