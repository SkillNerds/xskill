# CI workflow — see docs/dev-plan/testing-strategy.md
#
# Trigger matrix:
#   pull_request / push to main → risk-axis ut-it + smoke/team lifecycle/BDD/build
#                                 + Ubuntu live-agent E2E
#   workflow_dispatch / schedule → same + cross-platform live-agent E2E
#                                  + real-llm-e2e (graceful skip without secret)
#   300×300 control-plane stress runs only in the dedicated nightly workflow.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'  # nightly UTC 16:00

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ut-it:
    name: ut+it (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Split platform and Python compatibility axes instead of running the
        # full 3 OS × 4 Python Cartesian product.
        include:
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Normalize line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf input
      - name: Install package with dev extras
        run: pip install -e .[dev]
      - name: Run UT + IT
        if: runner.os != 'Windows'
        # E2E and aimock BDD each have a dedicated job below.
        # ``nightly`` 标记的负载/平台时序敏感测试移出 PR 矩阵，
        # 由 nightly-control-plane-stress.yml 的 nightly-flaky _job 按平台跑。
        run: >-
          pytest tests/ --ignore=tests/e2e --ignore=tests/bdd
          -q -m "not nightly" --durations=25
      - name: Run UT + IT
        if: runner.os == 'Windows'
        # Known timing-sensitive tests carry their own ``flaky`` marker. Do not
        # globally retry unrelated Windows regressions.
        run: >-
          pytest tests/ --ignore=tests/e2e --ignore=tests/bdd
          -q -m "not nightly" --durations=25

  skill-edit-bdd:
    name: skill-edit BDD (aimock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install xskill test dependencies
        run: pip install -e .[dev]
      - name: Run all SkillEdit behavior scenarios
        env:
          XSKILL_AIMOCK_E2E: "1"
        run: pytest tests/bdd -v --timeout=120 --durations=25

  smoke-e2e:
    name: smoke-e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Normalize line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf input
      - name: Install xskill (with dev extras)
        run: pip install -e .[dev]
      - name: Smoke E2E (stub LLM + fixture, no network)
        run: pytest tests/e2e/test_smoke.py -v --durations=25

  connect-lifecycle-e2e:
    name: connect + team C/S lifecycle e2e (linux/wsl mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install xskill (with dev extras)
        run: pip install -e .[dev]
      - name: Team lifecycle E2E (local fake LLM, no network)
        run: >-
          pytest tests/e2e/test_connect_lifecycle_e2e.py
          tests/e2e/test_team_cs_e2e.py
          -v --durations=25

  real-llm-e2e:
    name: real-llm-e2e (linux)
    if: github.event_name != 'pull_request'
    needs: smoke-e2e
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Check DeepSeek secret presence
        id: secret_check
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -n "${DEEPSEEK_API_KEY:-}" ]; then
            echo "have_secret=1" >> "$GITHUB_OUTPUT"
          else
            echo "have_secret=0" >> "$GITHUB_OUTPUT"
            echo "::warning::DEEPSEEK_API_KEY secret missing — real-llm-e2e will be skipped"
          fi
      - name: Install xskill (with dev extras)
        if: steps.secret_check.outputs.have_secret == '1'
        run: pip install -e .[dev]
      - name: Real-LLM E2E (DeepSeek)
        if: steps.secret_check.outputs.have_secret == '1'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_BASE_URL: https://api.deepseek.com
          OPENAI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          XSKILL_REAL_LLM_E2E: "1"
        run: |
          # The real-llm-e2e suite drives task / cluster / edit agents against a
          # real DeepSeek endpoint via OpenAI-compat base_url. Tests live under
          # ``tests/live/`` and self-gate on ``XSKILL_REAL_LLM_E2E`` env.
          if [ -d tests/live ]; then
            pytest tests/live -v -m "real_llm" --timeout=300 --durations=25 || exit_code=$?
            # continue-on-error at job level lets PRs surface failures without
            # blocking merge to main on transient API errors.
            exit ${exit_code:-0}
          else
            echo "::notice::tests/live/ not present yet — real-llm-e2e is a no-op stub"
          fi
      - name: Graceful skip notice
        if: steps.secret_check.outputs.have_secret != '1'
        run: echo "DEEPSEEK_API_KEY secret missing — real-llm-e2e skipped (no failure)"

  live-agent-e2e:
    # **mock LLM** drives real codex/opencode processes — no secret needed.
    # PRs and main pushes run the canonical Ubuntu contracts. Nightly/manual
    # runs expand the same job to the complete cross-platform matrix.
    name: live-agent-e2e (${{ matrix.os }}, ${{ matrix.agent }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
        agent: [codex, opencode]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install xskill (with dev extras)
        run: pip install -e .[dev]
      - name: Install codex CLI
        if: matrix.agent == 'codex'
        shell: bash
        env:
          PINNED_CODEX_VERSION: "0.149.0"
        run: |
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            npm i -g @openai/codex@latest
          else
            npm i -g "@openai/codex@${PINNED_CODEX_VERSION}"
          fi
          codex --version
      - name: Install opencode CLI
        if: matrix.agent == 'opencode'
        shell: bash
        env:
          PINNED_OPENCODE_VERSION: "1.18.21"
        run: |
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            npm i -g opencode-ai@latest
          else
            npm i -g "opencode-ai@${PINNED_OPENCODE_VERSION}"
          fi
          opencode --version
      - name: Live-agent E2E (real ${{ matrix.agent }} + mock LLM)
        shell: bash
        run: |
          # tests/live/* spin up an in-process mock LLM server, point codex /
          # opencode at it, spawn the real CLI for one short turn, then verify
          # xskill ingester picks up the resulting JSONL / SQLite session.
          # No external LLM API key required — fully offline E2E.
          pytest tests/live/test_${{ matrix.agent }}_live.py -v \
            --override-ini="addopts=" \
            -m live_agent --timeout=300 --durations=25

  verify-build:
    name: verify-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build tools
        run: pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Twine check
        run: twine check dist/*
