# Release: triggered by pushing a version tag (v*).
# Tag is the source of truth; setuptools-scm derives the package version from it.
# Pre-release tags (e.g. v0.6.28a1, v0.6.28rc1) create a GitHub Prerelease
# only. They deliberately do not upload to PyPI, so existing clients cannot
# auto-install an observation build.
# Publishing is gated by the test matrix and SkillHub search smoke test.
# The 300×300 control-plane stress test runs independently in the nightly workflow.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package with dev extras
        run: pip install -e .[dev]
      - name: Run pytest
        run: pytest tests/ -q

  skillhub-search-smoke:
    name: skillhub search smoke (py3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package with dev extras
        run: pip install -e .[dev]
      - name: Run skillhub search and dashboard/sync smoke gate
        run: >-
          pytest tests/stress/test_skillhub_search_smoke.py -v
          --override-ini="addopts=" -m stress
          --basetemp=.skillhub-search-artifacts
      - name: Upload skillhub smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-skillhub-search-smoke-${{ github.run_id }}
          path: .skillhub-search-artifacts/**
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30

  publish:
    name: build and publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, skillhub-search-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tooling
        run: pip install build twine setuptools-scm

      - name: Assert tag matches setuptools-scm derived version
        id: release_kind
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          BUILD_VERSION=$(python -m setuptools_scm)
          echo "tag=$TAG_VERSION scm=$BUILD_VERSION"
          if [ "$TAG_VERSION" != "$BUILD_VERSION" ]; then
            echo "::error::Tag ($TAG_VERSION) != setuptools_scm version ($BUILD_VERSION). Working tree may be dirty or commits exist after the tag."
            exit 1
          fi
          python - "$TAG_VERSION" "$GITHUB_OUTPUT" <<'PY'
          import sys
          from packaging.version import Version

          version = Version(sys.argv[1])
          with open(sys.argv[2], "a", encoding="utf-8") as output:
              output.write(f"prerelease={'true' if version.is_prerelease else 'false'}\n")
          PY

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify release wheel contains xskill package code
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheels = sorted(Path("dist").glob("xskill-*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected exactly one xskill wheel, got {len(wheels)}: {wheels}")

          with zipfile.ZipFile(wheels[0]) as zf:
              names = set(zf.namelist())

          required = {
              "xskill/__init__.py",
              "xskill/pipeline/worker_runtime.py",
              "xskill/team/client/updater.py",
              "xskill/team/server/api.py",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"wheel is missing required package files: {missing}")

          package_py = [name for name in names if name.startswith("xskill/") and name.endswith(".py")]
          if not package_py:
              raise SystemExit("wheel does not contain xskill Python package code")

          print(f"verified {wheels[0]} contains {len(package_py)} xskill Python files")
          PY

      - name: Twine check
        run: twine check dist/*

      - name: Stage pre-release migration utility
        if: github.ref_name == 'v0.6.28a1'
        run: cp scripts/xskill_v0_6_28a1_migrate.py dist/x.py

      - name: Publish to PyPI
        if: steps.release_kind.outputs.prerelease != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          # 幂等重跑:同版本文件已在 PyPI(如 CI 挂掉后手工 twine 补传过)时
          # 跳过而非 400 报错,让后面的 GitHub Release 步骤照常执行
          skip-existing: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 幂等:release 已存在(重跑/手工补建过)则跳过
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists, skipping"
            exit 0
          fi
          prerelease_args=()
          assets=(dist/*.whl dist/*.tar.gz)
          if [ "${{ steps.release_kind.outputs.prerelease }}" = "true" ]; then
            prerelease_args+=(--prerelease)
          fi
          if [ "$GITHUB_REF_NAME" = "v0.6.28a1" ]; then
            assets+=(dist/x.py)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "${assets[@]}" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${prerelease_args[@]}"
