<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#0E7C86"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF8EE"/><stop offset="1" stop-color="#FDF3E3"/>
    </linearGradient>
  </defs>
  <rect width="920" height="300" rx="18" fill="url(#bg)"/>
  <text x="40" y="46" font-size="22" font-weight="800" fill="#243B45">One solves it.</text>
  <text x="232" y="46" font-size="22" font-weight="800" fill="#E0613B">Everyone gets it.</text>

  <!-- solver -->
  <g>
    <circle cx="110" cy="170" r="40" fill="#fff" stroke="#0E7C86" stroke-width="3"/>
    <text x="110" y="166" font-size="30" text-anchor="middle">🧑‍💻</text>
    <text x="110" y="232" font-size="13" font-weight="700" fill="#0A5C64" text-anchor="middle">You solve it once</text>
  </g>
  <path d="M154,170 L250,170" stroke="#0E7C86" stroke-width="3" marker-end="url(#ah)"/>

  <!-- breathing glow behind the skill card -->
  <ellipse cx="337" cy="170" rx="82" ry="54" fill="#F4805E">
    <animate attributeName="opacity" values="0;0.20;0" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="78;94;78" dur="2.6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- skill card -->
  <g>
    <rect x="262" y="126" width="150" height="88" rx="14" fill="#FCE5DC" stroke="#F4805E" stroke-width="3"/>
    <text x="337" y="160" font-size="26" text-anchor="middle">🧬</text>
    <text x="337" y="192" font-size="14" font-weight="800" fill="#E0613B" text-anchor="middle">SKILL.md</text>
    <text x="337" y="248" font-size="13" font-weight="700" fill="#6B4A2B" text-anchor="middle">distilled automatically</text>
  </g>

  <!-- fan out -->
  <g stroke="#0E7C86" stroke-width="2.5" fill="none">
    <path d="M412,150 C520,110 560,90 650,86" marker-end="url(#ah)"/>
    <path d="M412,170 C540,170 560,170 650,170" marker-end="url(#ah)"/>
    <path d="M412,190 C520,230 560,250 650,254" marker-end="url(#ah)"/>
  </g>

  <!-- flowing light pulses: solver -> card, then card -> each teammate -->
  <circle r="5.5" fill="#0E7C86">
    <animateMotion path="M154,170 L250,170" dur="1.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.8;1" dur="1.3s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#0E7C86">
    <animateMotion path="M412,150 C520,110 560,90 650,86" dur="1.7s" begin="0.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.85;1" dur="1.7s" begin="0.2s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#0E7C86">
    <animateMotion path="M412,170 C540,170 560,170 650,170" dur="1.7s" begin="0.55s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.85;1" dur="1.7s" begin="0.55s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#0E7C86">
    <animateMotion path="M412,190 C520,230 560,250 650,254" dur="1.7s" begin="0.9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.85;1" dur="1.7s" begin="0.9s" repeatCount="indefinite"/>
  </circle>

  <!-- teammates: light up in turn -->
  <g font-size="26" text-anchor="middle">
    <g><circle cx="700" cy="86" r="30" fill="#fff" stroke="#2E8B6F" stroke-width="2.5">
      <animate attributeName="stroke-width" values="2.5;4.5;2.5" dur="1.7s" begin="0.2s" repeatCount="indefinite"/></circle><text x="700" y="95">👩‍💻</text></g>
    <g><circle cx="700" cy="170" r="30" fill="#fff" stroke="#2E8B6F" stroke-width="2.5">
      <animate attributeName="stroke-width" values="2.5;4.5;2.5" dur="1.7s" begin="0.55s" repeatCount="indefinite"/></circle><text x="700" y="179">🧑‍🔧</text></g>
    <g><circle cx="700" cy="254" r="30" fill="#fff" stroke="#2E8B6F" stroke-width="2.5">
      <animate attributeName="stroke-width" values="2.5;4.5;2.5" dur="1.7s" begin="0.9s" repeatCount="indefinite"/></circle><text x="700" y="263">👨‍💻</text></g>
  </g>
  <text x="800" y="166" font-size="14" font-weight="800" fill="#2E8B6F">…the whole</text>
  <text x="800" y="186" font-size="14" font-weight="800" fill="#2E8B6F">team, instantly</text>
</svg>
